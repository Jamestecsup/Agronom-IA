spring:
  application:
    name: agronomia-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/agronomia}
    username: ${DB_USERNAME:agronomia_api}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      location: ${UPLOAD_TEMP_DIR:${java.io.tmpdir}/agronomia-upload-tmp}
      # Permit PHP-compatible application validation at 15 MiB before the servlet transport cap.
      max-file-size: 16MB
      max-request-size: 80MB
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

plant:
  storage:
    directory: ${PLANT_UPLOAD_DIR:C:/xampp/plant-images}
