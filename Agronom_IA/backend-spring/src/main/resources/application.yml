spring:
  application:
    name: agronomia-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/agronomia}
    username: ${DB_USERNAME:agronomia_api}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      location: ${UPLOAD_TEMP_DIR:${java.io.tmpdir}/agronomia-upload-tmp}
      # Permit PHP-compatible application validation at 15 MiB before the servlet transport cap.
      max-file-size: 16MB
      max-request-size: 80MB
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
    constraints:
      # Una imagen de 15 MiB ocupa hasta ~20 Mi caracteres en Base64.
      max-string-length: 22000000
  mvc:
    problemdetails:
      enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

plant:
  storage:
    directory: ${PLANT_UPLOAD_DIR:C:/xampp/plant-images}

agronomia:
  ai:
    open-code:
      base-url: ${OPENCODE_SERVER_BASE_URL:http://127.0.0.1:4096}
      username: ${OPENCODE_SERVER_USERNAME:opencode}
      password: ${OPENCODE_SERVER_PASSWORD:}
      provider-id: opencode
      model-id: ${OPENCODE_MODEL_ID:deepseek-v4.1-flash-free}
    open-webui:
      base-url: ${OPENWEBUI_BASE_URL:http://192.168.17.11:3000}
      api-key: ${OPENWEBUI_API_KEY:}
      model: ${OPENWEBUI_MODEL:Qwen/Qwen3.6-35B-A3B-FP8}
      connect-timeout: ${OPENWEBUI_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPENWEBUI_READ_TIMEOUT:180s}
    chat:
      max-messages: 40
      max-message-characters: 8000
      max-response-characters: 20000
