spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: agronomia-backend
  datasource:
    # MySQL Server compartido con Django.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/agronomia}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    user: ${DB_MIGRATE_USER}
    password: ${DB_MIGRATE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      location: ${UPLOAD_TEMP_DIR:${java.io.tmpdir}/agronomia-upload-tmp}
      # Permit PHP-compatible application validation at 15 MiB before the servlet transport cap.
      max-file-size: 16MB
      max-request-size: 80MB
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

plant:
  storage:
    directory: ${PLANT_UPLOAD_DIR:../media/plant-images}

# --- Panel de administración ---
admin:
  token:
    # Cambia este secreto en cualquier equipo compartido (ADMIN_TOKEN_SECRET).
    secret: ${ADMIN_TOKEN_SECRET:dev-only-change-me}
    ttl-hours: ${ADMIN_TOKEN_TTL_HOURS:8}
  cors:
    origins: ${ADMIN_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

schedule:
  internal:
    token: ${SCHEDULE_INTERNAL_TOKEN:dev-only-agronomia-schedule}

ai:
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
  model: ${AI_MODEL:gemini-3.5-flash-lite}
